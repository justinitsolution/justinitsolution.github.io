name: Migrate JUSTIN IT SOLUTION website
on:
  push:
    paths:
      - '.github/workflows/migrate-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy full original website
        run: |
          git clone --depth 1 https://github.com/justinitsolution/justin-it-solution.git /tmp/justin-original
          rsync -a --exclude='.git' --exclude='.github/workflows/migrate-site.yml' /tmp/justin-original/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Migrate complete JUSTIN IT SOLUTION website"
            git push
          fi
